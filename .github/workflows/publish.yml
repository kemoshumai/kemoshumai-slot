name: Publish container

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and test
        run: |
          docker build --pull -t ghcr.io/kemoshumai/slot:latest .
          docker run --rm ghcr.io/kemoshumai/slot:latest
          test "$(docker run --rm --entrypoint id ghcr.io/kemoshumai/slot:latest -u)" = 10001
      - name: Push image
        run: docker push ghcr.io/kemoshumai/slot:latest
